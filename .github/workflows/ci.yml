on:
  pull_request:
    types: [opened, synchronize, edited, reopened]

name: CI

jobs:

  php-tests:
    env:
      ENV_INTERACTIVE: false
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - name: Build images
        run: make build

      - name: Install dependencies
        run: make composer install

      - name: Run unit tests
        run: make phpunit

      - name: Run other tests
        run: make full-test
